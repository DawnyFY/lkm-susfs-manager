name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 前端：类型检查 + 单测。缺了这两步，组件漏 import、类型错误这类问题只能靠人肉发现
      #（1.2.9 的 Sheet 漏 import 就是这样漏过去的）。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI deps
        working-directory: webui
        run: npm ci --no-audit --no-fund

      - name: WebUI typecheck
        working-directory: webui
        run: npx vue-tsc --noEmit

      - name: WebUI unit tests
        working-directory: webui
        run: npx vitest run

      # 构建产物必须与源码一致：tools/webui_fingerprint.py 的 sha256 写在 webroot/.build.json，
      # check_zip 会比对；这里额外做一次「重建后仍一致」，防止改了前端忘重建就提交
      - name: Rebuild WebUI (must match committed webroot)
        run: |
          sh tools/build_webui.sh "$PWD"
          git diff --exit-code -- module/webroot || {
            echo "::error::module/webroot 与源码不一致：本地跑 sh tools/build_webui.sh 后重新提交"
            exit 1
          }

      - name: Check text files for CR bytes
        run: python tools/check_no_crlf.py

      - name: Check for multi-line literals in shell scripts
        run: python tools/check_multiline_literals.py

      - name: Offline unit tests
        run: |
          for t in tools/test_*.sh; do
            echo "== $t"
            sh "$t" "$PWD"
          done

      - name: Validate update.json
        run: python tools/check_update_json.py

      - name: Build module ZIP
        run: python tools/build_module_zip.py

      - name: Validate module ZIP (archive, manifest, files, KMI, WebUI JS syntax)
        run: python tools/check_zip.py

      - name: Release manifest hash gate
        run: python tools/check_release_manifest.py

      - name: License compliance gate
        run: python tools/check_license_compliance.py dist/*.zip

      # 审计 B1 连续三次写错发布说明的数字，靠人眼没守住 —— 挪进门禁
      - name: Release notes triple gate (size / sha256 / manifest / file count)
        run: python tools/check_release_notes.py

      - name: Show SHA256
        run: sha256sum dist/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs_allinone
          path: dist/*.zip

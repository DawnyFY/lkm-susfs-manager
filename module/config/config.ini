# SUSFS 管理器配置（纯 KEY=VALUE，不会被 source）
# auto_load=1：开机自动加载 LKM 并应用规则；0：只在手动操作时加载
auto_load=1
# 匿名安装统计：只发送随机 install_id 与模块版本，不发送设备信息/路径/日志
anonymous_stats=1
# 非 root 进程隐藏 SUS 挂载点
hide_sus_mnts=1
# AVC 日志伪装（1.3.0 起默认开启）：优先用 ksu_susfs 命令；
# 官方 KernelSU 的 CLI 没有该命令，会自动回退到 LKM 参数
# /sys/module/susfs_guard_lkm/parameters/avc_su_ctx；置 0 可关闭并还原
avc_spoof=0
# 应用时清理旧 sus_path 规则：
#   0 = 只追加（默认，最保守）
#   1 = 只移除本模块上次写入的规则，不动其他隐藏模块
#   2 = 整表清空（会把其他模块的规则一起清掉，仅在明确需要时使用）
replace_rules=0
# 自动把 /data/adb 来源的模块挂载写入卸载列表（默认关闭；开启后强制过滤真实分区）
# 真实分区过滤始终生效，下面的键仅用于兼容旧配置
skip_legit_mounts=1
auto_try_umount=0
# 隐藏检测类应用自身的数据目录（如 duckdetector）会让其判定异常，默认跳过
skip_detection_paths=1

# 仅解锁 BL 可用的隐藏项（默认关闭）
hide_vendor_sepolicy=0
vold_isolation=0
# LKM 掉线看护间隔（分钟，0=关闭）
watchdog_minutes=0
